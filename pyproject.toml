[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-propka"
version = "0.1.0"
description = "Frozen-structure, soft-sequence titration model with Biotite topology and JAX differentiation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "jax>=0.4.35,<0.10", "biotite>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
reference = ["propka>=3.5,<4"]

[project.scripts]
jaxpropka = "jaxpropka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires Biotite and structure I/O",
  "reference: requires an installed external PROPKA implementation",
  "gpu: requires a JAX GPU device",
]
