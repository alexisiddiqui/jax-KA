name: numerical-and-molecular-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      JAXPROPKA_REQUIRE_INTEGRATION: '1'
      JAXPROPKA_REQUIRE_REFERENCE: '1'
      JAXPROPKA_TEST_REPORT_DIR: reports/ci-reference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,reference]'
      - run: python -m pip freeze > reports/ci-environment.txt
      - run: pytest -ra -m 'not gpu' --junitxml=reports/ci-pytest.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-reports-${{ matrix.python }}
          path: reports/
